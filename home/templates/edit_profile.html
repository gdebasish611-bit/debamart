<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Profile - Debamart</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7f5;
            color: #222;
        }

        /* ================= CONTAINER ================= */

        .container {
            width: 90%;
            max-width: 500px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        /* ================= HEADING ================= */

        h1 {
            text-align: center;
            color: #16a34a;
            margin-bottom: 25px;
        }

        /* ================= ERROR ================= */

        .error {
            background: #fee2e2;
            color: #b91c1c;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: center;
        }

        /* ================= SUCCESS ================= */

        .success {
            background: #dcfce7;
            color: #15803d;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: center;
        }

        /* ================= CURRENT PHOTO ================= */

        .current-photo {
            text-align: center;
            margin-bottom: 20px;
        }

        .current-photo img {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid #16a34a;
            display: block;
            margin: auto;
        }

        /* ================= DEFAULT PHOTO ================= */

        .default-photo {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: #dcfce7;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            margin: auto;
            border: 4px solid #16a34a;
        }

        /* ================= PHOTO TITLE ================= */

        .photo-title {
            text-align: center;
            margin-top: 10px;
            color: #666;
            font-size: 14px;
        }

        /* ================= LABEL ================= */

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        /* ================= TEXT INPUT ================= */

        input[type="text"],
        input[type="email"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input[type="text"]:focus,
        input[type="email"]:focus {
            border-color: #16a34a;
            box-shadow: 0 0 5px rgba(22, 163, 74, 0.2);
        }

        /* ================= FILE INPUT ================= */

        input[type="file"] {
            width: 100%;
            padding: 11px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            background: #fafafa;
            cursor: pointer;
            font-size: 14px;
        }

        input[type="file"]:hover {
            border-color: #16a34a;
        }

        /* ================= PHOTO NOTE ================= */

        .photo-note {
            font-size: 13px;
            color: #777;
            margin-top: 6px;
        }

        /* ================= SAVE BUTTON ================= */

        .btn {
            width: 100%;
            padding: 13px;
            margin-top: 25px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }

        .save {
            background: #16a34a;
            color: white;
        }

        .save:hover {
            background: #15803d;
        }

        /* ================= CANCEL ================= */

        .cancel {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #555;
            text-decoration: none;
            font-weight: 500;
        }

        .cancel:hover {
            color: #16a34a;
        }

        /* ================= MOBILE ================= */

        @media (max-width: 600px) {

            .container {
                width: 92%;
                margin: 25px auto;
                padding: 22px;
            }

            h1 {
                font-size: 28px;
            }

        }

    </style>

</head>


<body>


<div class="container">


    <!-- ================= HEADING ================= -->

    <h1>
        ✏️ Edit Profile
    </h1>


    <!-- ================= ERROR ================= -->

    {% if error %}

        <div class="error">
            {{ error }}
        </div>

    {% endif %}


    <!-- ================= FORM ================= -->

    <form
        method="POST"
        enctype="multipart/form-data"
    >

        {% csrf_token %}


        <!-- ================= CURRENT PROFILE PHOTO ================= -->

        <div
            class="current-photo"
            id="photoPreview"
        >

            {% if profile.profile_image %}

                <img
                    src="{{ profile.profile_image.url }}"
                    alt="Profile Photo"
                >

                <div class="photo-title">
                    Current Profile Photo
                </div>

            {% else %}

                <div class="default-photo">
                    👤
                </div>

                <div class="photo-title">
                    No Profile Photo
                </div>

            {% endif %}

        </div>


        <!-- ================= PROFILE PHOTO ================= -->

        <label>
            📷 Profile Photo
        </label>

        <input
            type="file"
            name="profile_image"
            id="profileImage"
            accept="image/png, image/jpeg, image/jpg"
        >

        <div class="photo-note">
            JPG, JPEG or PNG image select karo.
        </div>


        <!-- ================= USERNAME ================= -->

        <label>
            👤 Username
        </label>

        <input
            type="text"
            name="username"
            value="{{ user.username }}"
            placeholder="Enter username"
            required
        >


        <!-- ================= EMAIL ================= -->

        <label>
            📧 Email
        </label>

        <input
            type="email"
            name="email"
            value="{{ user.email }}"
            placeholder="Enter email"
        >


        <!-- ================= SAVE BUTTON ================= -->

        <button
            type="submit"
            class="btn save"
        >
            💾 Save Changes
        </button>

    </form>


    <!-- ================= CANCEL ================= -->

    <a
        href="{% url 'profile' %}"
        class="cancel"
    >
        ← Cancel
    </a>


</div>


<!-- ==================================================
     PHOTO PREVIEW JAVASCRIPT
================================================== -->

<script>

    const profileImage =
        document.getElementById("profileImage");

    const photoPreview =
        document.getElementById("photoPreview");


    profileImage.addEventListener(
        "change",
        function(event) {

            const file =
                event.target.files[0];


            if (!file) {
                return;
            }


            /* Check image type */

            if (!file.type.startsWith("image/")) {

                alert(
                    "Please select an image file."
                );

                profileImage.value = "";

                return;
            }


            /* Show selected image */

            const reader =
                new FileReader();


            reader.onload =
                function(e) {

                    photoPreview.innerHTML =

                        '<img ' +
                        'src="' + e.target.result + '" ' +
                        'alt="Selected Profile Photo">' +

                        '<div class="photo-title">' +
                        'New Profile Photo' +
                        '</div>';

                };


            reader.readAsDataURL(file);

        }
    );

</script>


</body>

</html>
