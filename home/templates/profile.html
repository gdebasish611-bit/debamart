<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile - Debamart</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7f5;
            color: #222;
        }

        .container {
            width: 95%;
            max-width: 750px;
            margin: 20px auto;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        /* ================= PROFILE HEADER ================= */

        .profile-header {
            text-align: center;
            padding: 40px 20px 30px;
            background: white;
        }

        /* ================= PROFILE PHOTO ================= */

        .profile-photo {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid #16a34a;
            display: block;
            margin: 0 auto 20px;
        }

        /* ================= DEFAULT PHOTO ================= */

        .default-photo {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: #16a34a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            margin: 0 auto 20px;
            border: 5px solid #16a34a;
        }

        h1 {
            margin: 0;
            color: #16a34a;
            font-size: 40px;
        }

        /* ================= PROFILE DETAILS ================= */

        .details {
            border-top: 1px solid #eee;
        }

        .detail-row {
            padding: 20px 28px;
            border-bottom: 1px solid #eee;
        }

        .label {
            color: #777;
            font-size: 18px;
            margin-bottom: 8px;
        }

        .value {
            font-size: 21px;
            font-weight: bold;
            color: #222;
        }

        /* ================= BUTTONS ================= */

        .buttons {
            display: flex;
            justify-content: center;
            gap: 18px;
            padding: 35px 20px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;
            padding: 16px 30px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            color: white;
        }

        .edit {
            background: #2563eb;
        }

        .orders {
            background: #16a34a;
        }

        .home {
            background: #eee;
            color: #222;
        }

        .btn:hover {
            opacity: 0.9;
        }

        /* ================= MOBILE ================= */

        @media (max-width: 600px) {

            .container {
                width: 94%;
                margin: 15px auto;
            }

            h1 {
                font-size: 32px;
            }

            .detail-row {
                padding: 18px 20px;
            }

            .buttons {
                flex-direction: column;
                padding: 25px;
            }

            .btn {
                text-align: center;
                width: 100%;
            }
        }

    </style>

</head>


<body>


<div class="container">


    <!-- ================= PROFILE HEADER ================= -->

    <div class="profile-header">


        <!-- ================= PROFILE IMAGE ================= -->

        {% if profile.profile_image %}

            <img
                src="{{ profile.profile_image.url }}"
                alt="Profile Photo"
                class="profile-photo"
            >

        {% else %}

            <div class="default-photo">
                👤
            </div>

        {% endif %}


        <!-- ================= TITLE ================= -->

        <h1>
            My Profile
        </h1>


    </div>


    <!-- ================= DETAILS ================= -->

    <div class="details">


        <!-- USERNAME -->

        <div class="detail-row">

            <div class="label">
                Username
            </div>

            <div class="value">
                {{ user.username }}
            </div>

        </div>


        <!-- EMAIL -->

        <div class="detail-row">

            <div class="label">
                Email
            </div>

            <div class="value">
                {% if user.email %}
                    {{ user.email }}
                {% else %}
                    No email added
                {% endif %}
            </div>

        </div>


        <!-- ACCOUNT STATUS -->

        <div class="detail-row">

            <div class="label">
                Account Status
            </div>

            <div class="value">

                {% if user.is_active %}
                    Active
                {% else %}
                    Inactive
                {% endif %}

            </div>

        </div>


    </div>


    <!-- ================= BUTTONS ================= -->

    <div class="buttons">


        <a
            href="{% url 'edit_profile' %}"
            class="btn edit"
        >
            ✏️ Edit Profile
        </a>


        <a
            href="{% url 'my_orders' %}"
            class="btn orders"
        >
            📦 My Orders
        </a>


        <a
            href="{% url 'home' %}"
            class="btn home"
        >
            🏠 Home
        </a>


    </div>


</div>


</body>

</html>
