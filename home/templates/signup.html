{% extends "base.html" %}

{% block title %}
Sign Up - Debamart
{% endblock %}

{% block body %}

<style>
    .signup-page {
        min-height: 600px;
        background: #f5f7f6;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 50px 20px;
    }

    .signup-box {
        width: 100%;
        max-width: 430px;
        background: white;
        padding: 35px;
        border-radius: 15px;
        box-shadow: 0 5px 25px rgba(0,0,0,0.08);
    }

    .signup-title {
        text-align: center;
        margin-bottom: 25px;
    }

    .signup-title .icon {
        font-size: 45px;
    }

    .signup-title h1 {
        margin: 10px 0 5px;
        color: #111827;
    }

    .signup-title h1 span {
        color: #16a34a;
    }

    .signup-title p {
        color: #6b7280;
        margin: 0;
    }

    .form-group {
        margin-bottom: 18px;
    }

    .form-group label {
        display: block;
        margin-bottom: 7px;
        color: #374151;
        font-weight: 600;
    }

    .form-group input {
        width: 100%;
        padding: 13px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        font-size: 15px;
        outline: none;
        box-sizing: border-box;
    }

    .form-group input:focus {
        border-color: #16a34a;
        box-shadow: 0 0 0 3px rgba(22,163,74,0.1);
    }

    .signup-btn {
        width: 100%;
        border: none;
        background: #16a34a;
        color: white;
        padding: 13px;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: 0.3s;
    }

    .signup-btn:hover {
        background: #15803d;
    }

    .signup-footer {
        text-align: center;
        margin-top: 20px;
        color: #6b7280;
    }

    .signup-footer a {
        color: #16a34a;
        text-decoration: none;
        font-weight: 600;
    }

    .error-message {
        background: #fee2e2;
        color: #b91c1c;
        padding: 10px;
        border-radius: 8px;
        margin-bottom: 18px;
        text-align: center;
    }
</style>


<div class="signup-page">

    <div class="signup-box">

        <div class="signup-title">

            <div class="icon">📝</div>

            <h1>
                <span>Create</span> Account
            </h1>

            <p>Join Debamart today!</p>

        </div>


        {% if error %}
            <div class="error-message">
                {{ error }}
            </div>
        {% endif %}


        <form method="POST">

            {% csrf_token %}


            <div class="form-group">

                <label>Username</label>

                <input
                    type="text"
                    name="username"
                    placeholder="Enter your username"
                    required
                >

            </div>


            <div class="form-group">

                <label>Email</label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label>Password</label>

                <input
                    type="password"
                    name="password"
                    placeholder="Create a password"
                    required
                >

            </div>


            <div class="form-group">

                <label>Confirm Password</label>

                <input
                    type="password"
                    name="confirm_password"
                    placeholder="Confirm your password"
                    required
                >

            </div>


            <button type="submit" class="signup-btn">
                ✨ Create Account
            </button>

        </form>


        <div class="signup-footer">

            Already have an account?

            <a href="{% url 'login' %}">
                Login
            </a>

        </div>

    </div>

</div>

{% endblock %}
