{% extends "base.html" %}

{% block title %}
Login - Debamart
{% endblock %}

{% block body %}

<style>
    .login-page {
        min-height: 600px;
        background: #f5f7f6;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 50px 20px;
    }

    .login-box {
        width: 100%;
        max-width: 430px;
        background: white;
        padding: 35px;
        border-radius: 15px;
        box-shadow: 0 5px 25px rgba(0,0,0,0.08);
    }

    .login-title {
        text-align: center;
        margin-bottom: 25px;
    }

    .login-title .icon {
        font-size: 45px;
    }

    .login-title h1 {
        margin: 10px 0 5px;
        color: #111827;
    }

    .login-title h1 span {
        color: #16a34a;
    }

    .login-title p {
        color: #6b7280;
        margin: 0;
    }

    .form-group {
        margin-bottom: 18px;
    }

    .form-group label {
        display: block;
        margin-bottom: 7px;
        color: #374151;
        font-weight: 600;
    }

    .form-group input {
        width: 100%;
        padding: 13px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        font-size: 15px;
        outline: none;
        box-sizing: border-box;
    }

    .form-group input:focus {
        border-color: #16a34a;
        box-shadow: 0 0 0 3px rgba(22,163,74,0.1);
    }

    .login-btn {
        width: 100%;
        border: none;
        background: #16a34a;
        color: white;
        padding: 13px;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: 0.3s;
    }

    .login-btn:hover {
        background: #15803d;
    }

    .login-footer {
        text-align: center;
        margin-top: 20px;
        color: #6b7280;
    }

    .login-footer a {
        color: #16a34a;
        text-decoration: none;
        font-weight: 600;
        transition: 0.3s;
    }

    .login-footer a:hover {
        color: #15803d;
        text-decoration: underline;
    }

    .error-message {
        background: #fee2e2;
        color: #b91c1c;
        padding: 10px;
        border-radius: 8px;
        margin-bottom: 18px;
        text-align: center;
    }
</style>


<div class="login-page">

    <div class="login-box">

        <div class="login-title">

            <div class="icon">
                👤
            </div>

            <h1>
                <span>Login</span> to Debamart
            </h1>

            <p>
                Welcome back!
            </p>

        </div>


        {% if error %}

            <div class="error-message">
                {{ error }}
            </div>

        {% endif %}


        <form method="POST">

            {% csrf_token %}


            <div class="form-group">

                <label>
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    placeholder="Enter your username"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-btn"
            >
                🔐 Login
            </button>

        </form>


        <div class="login-footer">

            Don't have an account?

            <a href="{% url 'signup' %}">
                Sign Up
            </a>

        </div>

    </div>

</div>


{% endblock %}
