{% extends "base.html" %}

{% block title %}
Verify OTP - Debamart
{% endblock %}

{% block body %}

<div style="
    max-width:450px;
    margin:60px auto;
    padding:30px;
    background:white;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,0.10);
">

    <!-- TITLE -->

    <h2 style="
        text-align:center;
        color:#198754;
        margin-bottom:10px;
    ">
        🔐 Verify OTP
    </h2>


    <!-- MOBILE MESSAGE -->

    <p style="
        text-align:center;
        color:#777;
        margin-bottom:8px;
    ">
        OTP sent to
    </p>


    <!-- MOBILE NUMBER -->

    <p style="
        text-align:center;
        color:#198754;
        font-weight:bold;
        font-size:17px;
        margin-bottom:25px;
    ">
        📱 {{ mobile }}
    </p>


    <!-- SUCCESS MESSAGE -->

    {% if message %}

        <div style="
            background:#e8f7ee;
            color:#198754;
            padding:12px;
            border-radius:8px;
            margin-bottom:15px;
            text-align:center;
        ">
            {{ message }}
        </div>

    {% endif %}


    <!-- ERROR MESSAGE -->

    {% if error %}

        <div style="
            background:#ffe5e5;
            color:#dc3545;
            padding:12px;
            border-radius:8px;
            margin-bottom:15px;
            text-align:center;
        ">
            {{ error }}
        </div>

    {% endif %}


    <!-- OTP FORM -->

    <form method="POST">

        {% csrf_token %}


        <!-- MOBILE HIDDEN FIELD -->

        <input
            type="hidden"
            name="mobile"
            value="{{ mobile }}"
        >


        <!-- OTP LABEL -->

        <label style="
            display:block;
            margin-bottom:8px;
            font-weight:600;
        ">
            Enter OTP
        </label>


        <!-- OTP INPUT -->

        <input
            type="text"
            name="otp"
            placeholder="Enter 6-digit OTP"
            maxlength="6"
            minlength="6"
            inputmode="numeric"
            pattern="[0-9]{6}"
            autocomplete="one-time-code"
            required
            style="
                width:100%;
                padding:13px;
                border:1px solid #ddd;
                border-radius:8px;
                font-size:18px;
                text-align:center;
                letter-spacing:5px;
                box-sizing:border-box;
                margin-bottom:18px;
                outline:none;
            "
        >


        <!-- VERIFY BUTTON -->

        <button
            type="submit"
            style="
                width:100%;
                padding:13px;
                background:#198754;
                color:white;
                border:none;
                border-radius:8px;
                font-size:16px;
                font-weight:600;
                cursor:pointer;
            "
        >
            ✅ Verify OTP
        </button>

    </form>


    <!-- BACK BUTTON -->

    <div style="
        text-align:center;
        margin-top:20px;
    ">

        <a
            href="{% url 'otp_login' %}"
            style="
                color:#198754;
                text-decoration:none;
                font-weight:600;
            "
        >
            ← Change Mobile Number
        </a>

    </div>

</div>

{% endblock %}
